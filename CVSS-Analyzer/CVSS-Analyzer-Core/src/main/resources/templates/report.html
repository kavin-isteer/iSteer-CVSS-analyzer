<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dependency Evidence Report</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            line-height: 1.6;
        }
        h1 {
            color: #2c3e50;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }
        .dependency {
            margin-bottom: 30px;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 15px;
            background-color: #f9f9f9;
        }
        .dependency.vulnerable {
            border-color: #e74c3c;
            background-color: #fff5f5;
        }
        .dependency-name {
            font-size: 1.2em;
            font-weight: bold;
            color: #2980b9;
            margin-bottom: 10px;
            cursor: pointer;
        }
        .dependency-name:hover {
            text-decoration: underline;
        }
        .evidence-section, .vulnerability-section, .identifier-section, .detailed-evidence-section {
            margin-left: 20px;
            margin-bottom: 15px;
        }
        .section-title {
            font-weight: bold;
            color: #16a085;
            cursor: pointer;
            padding: 5px;
            display: inline-block;
        }
        .section-title:hover {
            background-color: #f0f0f0;
            border-radius: 3px;
        }
        .section-title::before {
            content: "▼ ";
            font-size: 0.8em;
        }
        .section-title.collapsed::before {
            content: "► ";
        }
        .section-content {
            list-style-type: none;
            padding-left: 0;
            margin-top: 5px;
        }
        .section-item {
            margin-bottom: 8px;
            padding: 5px;
            background-color: white;
            border-left: 4px solid #3498db;
            padding-left: 10px;
        }
        .vulnerability-item {
            border-left-color: #e74c3c;
        }
        .source-info {
            font-style: italic;
            color: #7f8c8d;
            font-size: 0.9em;
        }
        .confidence-high {
            color: #27ae60;
        }
        .confidence-medium {
            color: #f39c12;
        }
        .confidence-low {
            color: #e74c3c;
        }
        .collapsible-content {
            display: block;
        }
        .collapsible-content.collapsed {
            display: none;
        }
        .suppress-button {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.8em;
        }
        .suppress-button:hover {
            background-color: #c0392b;
        }
        .data-sources {
            margin-top: 20px;
            font-size: 0.9em;
            color: #7f8c8d;
        }
        .file-path {
            font-size: 0.9em;
            color: #34495e;
            margin-bottom: 10px;
        }
        .evidence-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        .evidence-table th, .evidence-table td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        .evidence-table th {
            background-color: #f0f0f0;
            font-weight: bold;
        }
        .evidence-table tr:nth-child(even) {
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>
    <h1>Dependency Evidence Report</h1>
    
    <div th:each="dependency : ${dependencies}">
        <div class="dependency" th:classappend="${dependency.vulnerabilities != null and not #lists.isEmpty(dependency.vulnerabilities)} ? 'vulnerable'">
            <div class="dependency-name" onclick="toggleDependency(this)">
                <span th:text="${dependency.dependencyName}"></span>
            </div>
            
            <div class="dependency-content collapsible-content">
                
                <!-- Detailed Evidence -->
                <div class="detailed-evidence-section">
                    <div class="section-title collapsed" onclick="toggleSection(this)">Evidence</div>
                    <div class="section-content collapsible-content collapsed">
                        <table class="evidence-table">
                            <thead>
                                <tr>
                                    <th>Type</th>
                                    <th>Source</th>
                                    <th>Name</th>
                                    <th>Value</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="evidence : ${dependency.vendorEvidences}">
                                    <td>Vendor</td>
                                    <td th:text="${evidence.evidenceType}"></td>
                                    <td th:text=" ${evidence.evidence}"></td>
                                    <td th:text="${evidence.resolvedValue} ?: ${evidence.evidence}"></td>
                                </tr>
                                <tr th:each="evidence : ${dependency.productEvidences}">
                                    <td>Product</td>
                                    <td th:text="${evidence.evidenceType}"></td>
                                    <td th:text="${evidence.evidence}"></td>
                                    <td th:text="${evidence.resolvedValue} ?: ${evidence.evidence}"></td>
                                </tr>
                                <tr th:each="evidence : ${dependency.versionEvidences}">
                                    <td>Version</td>
                                    <td th:text="${evidence.evidenceType}"></td>
                                    <td th:text="${evidence.evidence}"></td>
                                    <td th:text="${evidence.resolvedValue} ?: ${evidence.evidence}"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="data-sources">
        <p>This report contains data retrieved from:</p>
        <ul>
            <li><a href="https://nvd.nist.gov">National Vulnerability Database</a></li>
        </ul>
    </div>

    <script>
        function toggleSection(element) {
            element.classList.toggle("collapsed");
            const content = element.nextElementSibling;
            content.classList.toggle("collapsed");
        }
        
        function toggleDependency(element) {
            const content = element.nextElementSibling;
            content.classList.toggle("collapsed");
            if (content.classList.contains("collapsed")) {
                const sections = content.querySelectorAll(".section-title");
                sections.forEach(section => {
                    if (!section.classList.contains("collapsed")) {
                        section.classList.add("collapsed");
                        section.nextElementSibling.classList.add("collapsed");
                    }
                });
            }
        }
        
        function generateSuppression(button) {
            const cve = button.getAttribute("data-cve") || "";
            const type = button.getAttribute("data-type") || "";
            const id = button.getAttribute("data-id") || "";
            
            let suppressionXml = '<?xml version="1.0" encoding="UTF-8"?>\n<suppressions xmlns="https://jeremylong.github.io/DependencyCheck/suppressions.xsd">\n';
            suppressionXml += '  <suppress>\n';
            if (cve) {
                suppressionXml += `    <cve>${cve}</cve>\n`;
            }
            if (type === "cpe" && id) {
                suppressionXml += `    <cpe>${id}</cpe>\n`;
            }
            suppressionXml += '  </suppress>\n</suppressions>';
            
            const blob = new Blob([suppressionXml], { type: 'text/xml' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `suppression-${cve || id.replace(/[:/]/g, '_')}.xml`;
            link.click();
        }
    </script>
</body>
</html>
